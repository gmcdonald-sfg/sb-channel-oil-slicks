# Renders report.qmd to HTML and publishes it to GitHub Pages:
#   https://gmcdonald-sfg.github.io/sb-channel-oil-slicks/
#
# Runs when report.qmd, the data snapshot in data/, or this file change on main.
# On a pull request it renders the report as a check (and attaches report.html
# to the run so reviewers can download it) but does not publish.
# It can also be started by hand: Actions tab -> "Render and publish report" -> Run workflow.
#
# One-time setup (already done if the site is live): repo Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".

name: Render and publish report

on:
  push:
    branches: [main]
    paths:
      - "report.qmd"
      - "data/**"
      - ".github/workflows/render-report.yml"
  pull_request:
    paths:
      - "report.qmd"
      - "data/**"
      - ".github/workflows/render-report.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If several pushes land close together, only the newest one is rendered and published.
concurrency:
  group: render-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt Linux binaries: much faster installs

      # The R packages report.qmd uses. If you add a library() call to report.qmd,
      # add the package here too.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::data.table
            any::sf
            any::jsonlite
            any::patchwork
            any::kableExtra
            any::rnaturalearth
            any::rnaturalearthdata

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render report.qmd
        run: quarto render report.qmd

      - name: Keep report.html with this run (download from the run's summary page)
        uses: actions/upload-artifact@v7
        with:
          name: report-html
          path: report.html

      - name: Prepare website
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          cp report.html _site/report.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    if: github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
